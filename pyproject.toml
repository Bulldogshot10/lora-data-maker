[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lora-data-maker"
version = "1.0.0"
description = "Termux-first dataset preparation toolkit for LoRA image datasets."
license = {text = "Apache-2.0"}
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "Pillow>=10,<13",
  "requests>=2.32,<3",
]

# SPDX: Apache-2.0

[project.scripts]
lora-data-maker = "lora_data_maker.cli:main"

[project.optional-dependencies]
tagger = [
  "numpy>=1.26,<3",
  "onnxruntime>=1.17,<2",
]
gallery = [
  "gallery-dl>=1.29,<2",
]
dev = [
  "numpy>=1.26,<3",
  "pytest>=8,<9",
]

[tool.setuptools.packages.find]
where = ["src"]
