[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lora-data-maker"
version = "1.0.2"
description = "Termux-first dataset preparation toolkit for LoRA image datasets."
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "Pillow>=10,<13",
  "requests>=2.32,<3",
]


[project.scripts]
lora-data-maker = "lora_data_maker.cli:main"

[project.optional-dependencies]
tagger = [
  "numpy>=1.26,<3",
  "onnxruntime>=1.17,<2",
]
gallery = [
  "gallery-dl>=1.29,<2",
]
dev = [
  "numpy>=1.26,<3",
  "pytest>=8,<9",
]

[tool.setuptools.packages.find]
where = ["src"]
