[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lora-data-maker"
version = "2.1.0"
description = "Termux-first dataset preparation toolkit for LoRA image datasets."
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "Pillow>=10,<13",
  "requests>=2.32,<3",
]


[project.scripts]
lora-data-maker = "lora_data_maker.cli:main"
lora-data-maker-web = "lora_data_maker.web:serve"

[project.optional-dependencies]
tagger = [
  "numpy>=1.26,<3",
  "onnxruntime>=1.17,<2",
]
quality = [
  "numpy>=1.26,<3",
  "onnxruntime>=1.17,<2",
  "opencv-python-headless>=4.10,<5",
]
chromium = [
  "selenium>=4.37,<5",
]
playwright = [
  "playwright-termux==2.0.0",
]
web = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "python-multipart>=0.0.20,<1",
  "uvicorn>=0.35,<1",
]
dev = [
  "numpy>=1.26,<3",
  "pytest>=8,<9",
]
face = [
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.10,<5",
]
caption-vlm = [
  "llama-cpp-python>=0.3.36,<0.4",
]
caption-onnx = [
  "numpy>=1.26,<3",
  "onnxruntime>=1.17,<2",
  "transformers>=4.54,<5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lora_data_maker = ["static/*"]

[tool.pytest.ini_options]
markers = [
  "real_caption_runtime: tests requiring the optional caption-vlm runtime stack",
]
