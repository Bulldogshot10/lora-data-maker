[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lora-data-maker"
version = "0.1.0"
description = "Termux-first dataset preparation toolkit for LoRA image datasets."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "Pillow>=10,<13",
  "requests>=2.32,<3",
]

[project.scripts]
lora-data-maker = "lora_data_maker.cli:main"

[project.optional-dependencies]
gallery = [
  "gallery-dl>=1.29,<2",
]
dev = [
  "pytest>=8,<9",
]

[tool.setuptools.packages.find]
where = ["src"]
