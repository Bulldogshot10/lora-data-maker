[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lora-data-maker"
version = "1.3.0"
description = "Termux-first dataset preparation toolkit for LoRA image datasets."
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "Pillow>=10,<13",
  "requests>=2.32,<3",
]


[project.scripts]
lora-data-maker = "lora_data_maker.cli:main"

[project.optional-dependencies]
tagger = [
  "numpy>=1.26,<3",
  "onnxruntime>=1.17,<2",
]
chromium = [
  "selenium>=4.37,<5",
]
playwright = [
  "playwright-termux==2.0.0",
]
llama_cpp = [
  "llama-cpp-python>=0.3.36,<0.4",
]
dev = [
  "numpy>=1.26,<3",
  "pytest>=8,<9",
]
face = [
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.10,<5",
]

[tool.setuptools.packages.find]
where = ["src"]
