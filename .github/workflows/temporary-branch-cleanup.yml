name: Temporary CI branch cleanup

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Delete the temporary CI branch
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const { owner, repo } = context.repo;
            const branch = "ci/termux-google-x11-smoke";
            try {
              await github.rest.git.deleteRef({
                owner,
                repo,
                ref: `heads/${branch}`
              });
              core.info(`Deleted temporary branch ${branch}`);
            } catch (error) {
              if (error.status === 404) {
                core.info(`Branch ${branch} was already absent`);
              } else {
                throw error;
              }
            }
