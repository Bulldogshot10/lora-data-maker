name: core smoke

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: python -m pip install .

      - name: Install Playwright extra
        run: |
          python -m pip install ".[playwright]"
          python -c "import playwright_termux; print('playwright-termux:', getattr(playwright_termux, '__version__', 'installed'))"

      - name: Install test tooling and optional runtimes
        run: python -m pip install ".[web,tagger,quality,dev]"

      - name: Compile
        run: python -m compileall -q src tests

      - name: Run tests
        run: pytest -q

      - name: CLI version
        run: lora-data-maker --version

      - name: CLI help
        run: lora-data-maker --help

      - name: Tag help
        run: lora-data-maker tag --help

      - name: Caption help
        run: lora-data-maker caption --help

      - name: Reconcile help
        run: lora-data-maker reconcile --help

      - name: Build help
        run: lora-data-maker build --help

      - name: Export help
        run: lora-data-maker export --help

      - name: Pack help
        run: lora-data-maker pack --help

      - name: License and release smoke
        run: |
          test -f LICENSE
          test -f NOTICE
          test -f docs/RESPONSIBLE_USE.md
          test -f RELEASE_NOTES.md

      - name: Documentation smoke
        run: |
          test -f docs/INSTALL_TERMUX.md
          test -f docs/CLI.md
          test -f docs/CONFIG.md
          test -f docs/DATASET.md
          test -f docs/TROUBLESHOOTING.md
          test -f docs/ARCHITECTURE.md
          test -f docs/ROADMAP.md

      - name: Init and inspect project
        run: |
          rm -rf .smoke-project
          lora-data-maker init .smoke-project --name julia --subject julia
          test -f .smoke-project/config.toml
          test -f .smoke-project/manifest.json
          test -d .smoke-project/raw
          test -d .smoke-project/work
          test -d .smoke-project/output
          test -d .smoke-project/cache
          lora-data-maker info .smoke-project


  yolox-smoke:
    name: YOLOX person detector smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install quality runtime
        run: python -m pip install ".[quality,dev]"

      - name: Download pinned YOLOX-Nano model
        run: |
          curl -L --fail --retry 3 -o yolox_nano.onnx \
            "https://huggingface.co/hr16/yolox-onnx/resolve/761141cbf90ddd9438943b3cd1b1c46ade29c714/yolox_nano.onnx"
          echo "c789161ed43c8269fcd4e67c67eeeb4e80c622da2eb296a20bc6007bd18a0b7d  yolox_nano.onnx" | sha256sum -c -

      - name: Run real YOLOX smoke test
        env:
          LORA_DATA_MAKER_YOLOX_MODEL: ${{ github.workspace }}/yolox_nano.onnx
        run: pytest -q tests/test_person_detector.py -k real_model_smoke

  face-smoke:
    name: YuNet face smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install face runtime
        run: python -m pip install ".[face,dev]"

      - name: Run face detector smoke tests
        run: pytest -q tests/test_face_detector.py -k real_model_smoke
