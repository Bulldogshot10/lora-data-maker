name: core smoke

on:
  workflow_dispatch:
    inputs:
      heavy_suite:
        description: "Optional model/runtime smoke test to run"
        type: choice
        required: true
        default: none
        options:
          - none
          - yolox
          - face
          - textocr
          - caption
          - all

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install test dependencies
        run: python -m pip install ".[web,tagger,quality,dev]"

      - name: Compile
        run: python -m compileall -q src tests

      - name: Run tests
        run: pytest -q -m "not real_caption_runtime"

      - name: CLI version
        run: lora-data-maker --version

      - name: CLI help
        run: lora-data-maker --help

      - name: Tag help
        run: lora-data-maker tag --help

      - name: Caption help
        run: lora-data-maker caption --help

      - name: Reconcile help
        run: lora-data-maker reconcile --help

      - name: Build help
        run: lora-data-maker build --help

      - name: Export help
        run: lora-data-maker export --help

      - name: Pack help
        run: lora-data-maker pack --help

      - name: License and release smoke
        run: |
          test -f LICENSE
          test -f NOTICE
          test -f docs/RESPONSIBLE_USE.md
          test -f RELEASE_NOTES.md

      - name: Documentation smoke
        run: |
          test -f docs/INSTALL_TERMUX.md
          test -f docs/CLI.md
          test -f docs/CONFIG.md
          test -f docs/DATASET.md
          test -f docs/TROUBLESHOOTING.md
          test -f docs/ARCHITECTURE.md
          test -f docs/ROADMAP.md

      - name: Init and inspect project
        run: |
          rm -rf .smoke-project
          lora-data-maker init .smoke-project --name julia --subject julia
          test -f .smoke-project/config.toml
          test -f .smoke-project/manifest.json
          test -d .smoke-project/raw
          test -d .smoke-project/work
          test -d .smoke-project/output
          test -d .smoke-project/cache
          lora-data-maker info .smoke-project


  yolox-smoke:
    if: github.event_name == 'workflow_dispatch' && (inputs.heavy_suite == 'yolox' || inputs.heavy_suite == 'all')
    name: YOLOX person detector smoke
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install quality runtime
        run: python -m pip install ".[quality,dev]"

      - name: Download pinned YOLOX-Nano model
        run: |
          curl -L --fail --retry 3 -o yolox_nano.onnx \
            "https://huggingface.co/hr16/yolox-onnx/resolve/761141cbf90ddd9438943b3cd1b1c46ade29c714/yolox_nano.onnx"
          echo "c789161ed43c8269fcd4e67c67eeeb4e80c622da2eb296a20bc6007bd18a0b7d  yolox_nano.onnx" | sha256sum -c -

      - name: Run real YOLOX smoke test
        env:
          LORA_DATA_MAKER_YOLOX_MODEL: ${{ github.workspace }}/yolox_nano.onnx
        run: pytest -q tests/test_person_detector.py -k real_model_smoke

  face-smoke:
    if: github.event_name == 'workflow_dispatch' && (inputs.heavy_suite == 'face' || inputs.heavy_suite == 'all')
    name: YuNet face smoke
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install face runtime
        run: python -m pip install ".[face,dev]"

      - name: Run face detector smoke tests
        run: pytest -q tests/test_face_detector.py -k real_model_smoke


  textocr-smoke:
    if: github.event_name == 'workflow_dispatch' && (inputs.heavy_suite == 'textocr' || inputs.heavy_suite == 'all')
    name: PP-OCR text detector smoke
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install quality runtime
        run: python -m pip install ".[quality,dev]"

      - name: Download pinned PP-OCR model
        run: |
          curl -L --fail --retry 3 -o text_detection_en_ppocrv3_2023may.onnx \
            "https://huggingface.co/opencv/text_detection_ppocr/resolve/eb8f1ab7550dc8d895a1c950f6a7e9ba52df0d27/text_detection_en_ppocrv3_2023may.onnx"
          echo "03f550c6b406fda8bf54bd8327815f6c7e2edd98cea02348c93d879254366587  text_detection_en_ppocrv3_2023may.onnx" | sha256sum -c -

      - name: Download OCR fixture image
        run: |
          curl -L --fail --retry 3 -o gsoc.jpg \
            "https://huggingface.co/opencv/text_detection_ppocr/resolve/eb8f1ab7550dc8d895a1c950f6a7e9ba52df0d27/example_outputs/gsoc.jpg"
          echo "c6c852b20c3b187d3eefc7e0d4e89a89ec96637dfc544f8169bcfe4981ce8143  gsoc.jpg" | sha256sum -c -

      - name: Run real PP-OCR smoke test
        env:
          LORA_DATA_MAKER_TEXTOCR_MODEL: ${{ github.workspace }}/text_detection_en_ppocrv3_2023may.onnx
          LORA_DATA_MAKER_TEXTOCR_IMAGE: ${{ github.workspace }}/gsoc.jpg
        run: pytest -q tests/test_text_detector.py -k ppocr_real_model_smoke

  caption-runtime-smoke:
    if: github.event_name == 'workflow_dispatch' && (inputs.heavy_suite == 'caption' || inputs.heavy_suite == 'all')
    name: Caption VLM runtime smoke
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.13"

      - name: Install caption VLM runtime
        run: python -m pip install ".[caption-vlm,dev]"

      - name: Check caption VLM dependencies
        run: python -m pip check

      - name: Run real caption runtime smoke tests
        run: pytest -q tests/test_caption_real_runtime.py

