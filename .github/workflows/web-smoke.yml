name: WebUI smoke

on:
  # Core CI already runs the complete non-model test suite. Keep this
  # focused WebUI workflow available for on-demand debugging only.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install ".[web,tagger,dev]"
      - run: pytest -q tests/test_web.py tests/test_web_scrape.py
