[project]
name = "my-dataset"
subject = "my-dataset"
trigger = "my-dataset"

[paths]
raw = "raw"
work = "work"
output = "output"
cache = "cache"

[scraper]
backend = "google"
query = "my-dataset"
count = 300
timeout = 20
retries = 3
delay = 1.0
min_width = 512
min_height = 512

[validation]
min_width = 1
min_height = 1
max_width = 0
max_height = 0
min_file_size = 1
max_file_size = 0

[processing]
target_size = 512
face_crop = false
blur_threshold = 0.0

[dedup]
exact = true
perceptual = true
perceptual_distance = 6

[tagger]
backend = "wd14"
threshold = 0.35
model = "SmilingWolf/wd-eva02-large-tagger-v3"

[tag_rules]
remove = [
  "watermark",
  "signature",
  "logo",
  "text",
]

[caption]
separator = ", "
subject_position = "first"
trigger_from_subject = true
