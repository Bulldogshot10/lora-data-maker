[project]
name = "my-dataset"
subject = "my-dataset"
trigger = "my-dataset"

[paths]
raw = "raw"
work = "work"
output = "output"
cache = "cache"

[scraper]
backend = "duckduckgo"
query = "my-dataset"
count = 300
timeout = 20
retries = 3
delay = 1.0
max_scrolls = 30

[validation]
min_width = 1
min_height = 1
max_width = 0
max_height = 0
min_file_size = 1
max_file_size = 0

[quality]
min_width = 512
min_height = 512
blur_threshold = 0.0
max_aspect_ratio = 0.0
person_check = false
person_threshold = 0.35
text_check = true
text_confidence = 0.5
text_min_area_ratio = 0.0004
max_persons = 1
min_subject_area = 0.12
min_subject_visibility = 0.35

[processing]
target_width = 512
target_height = 512
resize_mode = "cover"
jpeg_quality = 95
face_crop = false
face_padding = 1.75

[dedup]
exact = true
perceptual = true
perceptual_distance = 6

[tagger]
backend = "wd14"
preset = "sweetspot"
threshold = 0.35
character_threshold = 0.85
use_mcut = false
batch_size = 1
download_timeout = 60

[tag_rules]
remove = [
  "watermark",
  "signature",
  "logo",
  "text",
]

[caption]
backend = "deterministic"
separator = ", "
subject_position = "first"
trigger_from_subject = true
max_tokens = 77

[caption.vlm]
model_path = ""
mmproj_path = ""
chat_format = "mtmd"
# supported: mtmd, qwen2.5-vl, gemma4, qwen3.5, smolvlm
max_tokens = 128
temperature = 0.1
top_p = 0.95
top_k = 40
n_ctx = 4096
n_threads = 4
n_gpu_layers = 0
seed = 42

[export]
repeats = 1
folder_name = ""
